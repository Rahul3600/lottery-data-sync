name: Lottery Data Sync

on:
  schedule:
    # Run 20 minutes after the official Nagaland State Lottery draw times (IST)
    # IST = UTC + 5:30, so subtract 5:30 from IST to get UTC
    - cron: '50 7 * * *'   # 1:20 PM IST  (07:50 UTC)
    - cron: '50 12 * * *'  # 6:20 PM IST  (12:50 UTC)
    - cron: '50 14 * * *'  # 8:20 PM IST  (14:50 UTC)
    
    # Run at 4:30 PM IST (11:00 UTC) for Kerala State Lottery
    - cron: '0 11 * * *'   # 4:30 PM IST  (11:00 UTC)
  workflow_dispatch:        # Allows you to run this workflow manually from Actions tab

jobs:
  sync-lottery-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
        
      - name: Install dependencies
        run: pip install requests PyMuPDF pytz

      # ── Step 1: Fetch Dear Lottery result ──────────────────────────────────
      - name: Run Dear Lottery fetcher
        if: github.event_name == 'workflow_dispatch' || contains(github.event.schedule, '7') || contains(github.event.schedule, '12') || contains(github.event.schedule, '14')
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python scripts/lottery_fetcher.py

      # ── Step 2: Generate Dear Lottery predictions (after result is saved) ──
      - name: Run Dear Lottery predictor
        if: github.event_name == 'workflow_dispatch' || contains(github.event.schedule, '7') || contains(github.event.schedule, '12') || contains(github.event.schedule, '14')
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python scripts/dear_predictor.py

      # ── Step 3: Fetch Kerala Lottery result ────────────────────────────────
      - name: Run Kerala Lottery fetcher
        if: github.event_name == 'workflow_dispatch' || contains(github.event.schedule, '11')
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: python scripts/kerala_fetcher.py

      # ── Step 4: Generate Kerala Lottery predictions ────────────────────────
      - name: Run Kerala Lottery predictor
        if: github.event_name == 'workflow_dispatch' || contains(github.event.schedule, '11')
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: python scripts/kerala_predictor.py
